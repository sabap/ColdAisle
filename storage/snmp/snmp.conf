# ColdAisle Net-SNMP config for Windows PHP CLI / scheduled poll worker.
# Loaded when SNMPCONFPATH points at this directory (see scripts/run_poll_snmp.cmd).
#
# Do NOT auto-load the standard IETF MIB set — those files are not present on
# typical Windows PHP builds and cause "Cannot find module (IP-MIB)" spam / hangs.
# ColdAisle uses numeric OIDs only for polling; symbolic MIBs are optional uploads.

mibs none
